<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-xl bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">📝 TODO List</h1>

        <!-- Форма добавления -->
        <form @submit.prevent="addTodo" class="flex gap-2 mb-6">
            <input
                type="text"
                v-model="newTodo"
                placeholder="Что нужно сделать?"
                autocomplete="off"
                class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent"
            >
            <button
                type="submit"
                class="bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-semibold px-5 py-2 rounded-lg transition-colors"
            >
                Добавить
            </button>
        </form>

        <!-- Фильтры -->
        <div class="flex gap-2 mb-4 text-sm">
            <button
                v-for="f in filters"
                :key="f.value"
                @click="filter = f.value"
                :class="['px-3 py-1.5 rounded-full font-medium',
                    filter === f.value ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300']"
            >
                {{ f.label }}
            </button>
        </div>

        <!-- Список -->
        <ul class="space-y-2">
            <li
                v-for="todo in filteredTodos"
                :key="todo.id"
                :class="['flex items-center gap-3 bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 group',
                    todo.done ? 'opacity-60' : '']"
            >
                <input
                    type="checkbox"
                    :checked="todo.done"
                    @change="todo.done = !todo.done"
                    class="w-5 h-5 accent-blue-500 cursor-pointer shrink-0"
                >
                <span :class="['flex-1 break-words', todo.done ? 'line-through text-gray-400' : 'text-gray-800']">
                    {{ todo.text }}
                </span>
                <button
                    @click="removeTodo(todo.id)"
                    class="text-gray-300 hover:text-red-500 transition-colors shrink-0"
                    title="Удалить"
                >
                    ✕
                </button>
            </li>
        </ul>

        <!-- Пустое состояние -->
        <p v-if="filteredTodos.length === 0" class="text-center text-gray-400 py-8">Пока ничего нет 🌱</p>

        <!-- Нижняя панель -->
        <div class="flex justify-between items-center mt-6 pt-4 border-t border-gray-200 text-sm text-gray-600">
            <span>{{ counterText }}</span>
            <button
                @click="clearCompleted"
                :disabled="!hasCompleted"
                class="text-red-500 hover:text-red-600 hover:underline disabled:opacity-40 disabled:no-underline"
            >
                Удалить выполненные
            </button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'todos';
        const { createApp, ref, computed, watch } = Vue;

        createApp({
            setup() {
                // ---------- Состояние ----------
                const todos = ref(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
                const newTodo = ref('');
                const filter = ref('all');

                const filters = [
                    { value: 'all', label: 'Все' },
                    { value: 'active', label: 'Активные' },
                    { value: 'completed', label: 'Выполненные' },
                ];

                // ---------- Сохранение ----------
                watch(todos, val => {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(val));
                }, { deep: true });

                // ---------- Computed ----------
                const filteredTodos = computed(() =>
                    todos.value.filter(t =>
                        filter.value === 'all' ? true
                        : filter.value === 'active' ? !t.done
                        : t.done
                    )
                );

                const activeCount = computed(() => todos.value.filter(t => !t.done).length);
                const hasCompleted = computed(() => todos.value.some(t => t.done));

                const counterText = computed(() =>
                    todos.value.length === 0
                        ? '0 задач'
                        : `${activeCount.value} осталось · ${todos.value.length} всего`
                );

                // ---------- Методы ----------
                function addTodo() {
                    const text = newTodo.value.trim();
                    if (!text) return;
                    todos.value.push({ id: Date.now(), text, done: false });
                    newTodo.value = '';
                }

                function removeTodo(id) {
                    todos.value = todos.value.filter(t => t.id !== id);
                }

                function clearCompleted() {
                    todos.value = todos.value.filter(t => !t.done);
                }

                return {
                    todos, newTodo, filter, filters,
                    filteredTodos, activeCount, hasCompleted, counterText,
                    addTodo, removeTodo, clearCompleted,
                };
            },
        }).mount('#app');
    </script>
</body>
</html>
